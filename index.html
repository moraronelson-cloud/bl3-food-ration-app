async function sha256(text){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}

function mapData(roundRows,allocRows,payRows){
 const byRound=new Map(roundRows.map(r=>[r.id,{id:r.id,site:r.site_name,coverageStart:r.coverage_start,coverageEnd:r.coverage_end,disbursementDate:r.disbursement_date,siteName:r.site_name||state.settings.site||'BL3',siteManagerName:r.site_manager_name||'',siteManagerPhone:r.site_manager_phone||'',fx:Number(r.fx),closed:r.closed,notes:r.notes||'',createdAt:r.created_at,updatedAt:r.updated_at,allocations:[],payments:[]} ]));
 allocRows.forEach(a=>{const r=byRound.get(a.round_id);if(r){const def=defaultSectionTranslation(a.section_name);r.allocations.push({id:a.id,name:a.section_name,nameFr:a.section_name_fr||(def?.fr||''),nameZh:a.section_name_zh||(def?.zh||''),nameLn:a.section_name_ln||(def?.ln||''),count:a.headcount,rate:Number(a.rate_usd),sort:a.sort_order,lastEnteredBy:a.last_entered_by||'',lastEnteredAt:a.last_entered_at||null})}});
 payRows.forEach(p=>{const r=byRound.get(p.round_id);if(r)r.payments.push({id:p.id,allocationId:p.allocation_id,section:p.section_name_snapshot,amount:Number(p.amount_usd),receiver:p.receiver||'',date:p.payment_date,notes:p.notes||'',proofPath:p.proof_path,createdAt:p.created_at,updatedAt:p.updated_at})});
 byRound.forEach(r=>r.allocations.sort((a,b)=>a.sort-b.sort||a.name.localeCompare(b.name)));
 state.rounds=[...byRound.values()].sort((a,b)=>b.coverageStart.localeCompare(a.coverageStart));
}
function cacheState(){localStorage.setItem(CACHE_KEY,JSON.stringify({settings:state.settings,rounds:state.rounds,masterSections:state.masterSections,savedAt:new Date().toISOString()}))}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY));if(c){state.settings=c.settings||state.settings;state.rounds=c.rounds||[];state.masterSections=c.masterSections||[];return true}}catch(e){}return false}

async function loadAll(showLoading=true){
 if(showLoading)showBusy();
 if(!isOnline()){
   const had=loadCache();
   if(!had)return renderLoadFailure('You are offline and there is no cached ration data on this device yet.');
   renderActive();return;
 }
 try{
  const req=Promise.all([
   SB.from('ration_settings').select('*').eq('id',1).single(),
   SB.from('ration_rounds').select('*').order('coverage_start',{ascending:false}),
   SB.from('ration_allocations').select('*').order('sort_order',{ascending:true}),
   SB.from('ration_payments').select('*').order('payment_date',{ascending:true}),
   SB.from('ration_master_sections').select('*').eq('active',true).order('sort_order',{ascending:true})
  ]);
  const [s,r,a,p,m]=await withTimeout(req,12000,'Data sync');
  for(const x of [s,r,a,p,m])if(x.error)throw x.error;
  state.settings={site:s.data.site_name,fx:Number(s.data.default_fx),cycleDays:s.data.cycle_days};
  state.masterSections=(m.data||[]).map(x=>({id:x.id,name:x.section_name,nameFr:x.section_name_fr||'',nameZh:x.section_name_zh||'',nameLn:x.section_name_ln||'',sort:x.sort_order,siteName:x.site_name}));
  mapData(r.data||[],a.data||[],p.data||[]);
  if(isRoundScope()){
    state.rounds=state.rounds.filter(x=>x.id===state.scopeRoundId);
    if(state.rounds.length)currentRoundId=state.scopeRoundId;
  }
  cacheState();
  renderActive();
 }catch(err){
  console.error(err);
  const had=loadCache();
  if(had){
    toast('Live sync failed. Showing cached data.',true);
    renderActive();
  }else{
    renderLoadFailure(err.message||'Could not load ration data.');
  }
 }
}

 const remaining=Math.max(0,approved-paid);let status='not';if(paid>0)status=(approved>0&&paid>=approved-0.005&&missingProof===0)?'done':'partial';

function exportRoundExcel(r){
 if(!canExport())return requestPermission('Round Excel export');
 const rows=[['Site','Round','Start','End','Section','No. of workers','Amount / person','Total to disburse','Paid','Remaining']];
 (r.allocations||[]).forEach(a=>{
   const total=Number(a.count||0)*Number(a.rate||0);
   const paid=(r.payments||[]).filter(p=>p.allocationId===a.id||p.section===a.name).reduce((s,p)=>s+Number(p.amount||0),0);
   rows.push([r.siteName||state.settings.site||'BL3',chronologicalRoundNumber(r),r.coverageStart,r.coverageEnd,sectionName(a),Number(a.count||0),Number(a.rate||0),total,paid,Math.max(0,total-paid)]);

}

}

     }else{

         site_name:site,coverage_start:s,coverage_end:e,disbursement_date:d||null,
         site_manager_name:managerName,site_manager_phone:managerPhone,fx:f,closed:false,notes:'',created_by:null
       }).select().single();
       if(error)throw error;
       if(state.masterSections.length){
         const rows=state.masterSections.map((a,i)=>({round_id:data.id,section_name:a.name,section_name_fr:a.nameFr||'',section_name_zh:a.nameZh||'',section_name_ln:a.nameLn||'',headcount:0,rate_usd:0,sort_order:Number(a.sort)||i+1}));
         const ins=await SB.from('ration_allocations').insert(rows);if(ins.error)throw ins.error;
       }
       toast(t('roundCreated'));currentRoundId=data.id
     }
     closeModal();await loadAll(false);renderHome()
   }catch(e){handleError(e);disableModal(false)}
 }
}
async function duplicateNext(r){
 if(!requireAdmin())return;
 const start=addDays(r.coverageEnd,1),end=addDays(start,state.settings.cycleDays-1);
 try{
   const {data,error}=await SB.from('ration_rounds').insert({site_name:r.siteName||state.settings.site,coverage_start:start,coverage_end:end,disbursement_date:start,site_manager_name:r.siteManagerName||'',site_manager_phone:r.siteManagerPhone||'',fx:r.fx,closed:false,notes:'',created_by:null}).select().single();
   if(error)throw error;

   if(source.length){
     const rows=source.map((a,i)=>({round_id:data.id,section_name:a.name,section_name_fr:a.nameFr||'',section_name_zh:a.nameZh||'',section_name_ln:a.nameLn||'',headcount:0,rate_usd:0,sort_order:Number(a.sort)||i+1}));
     const ins=await SB.from('ration_allocations').insert(rows);if(ins.error)throw ins.error;

function paymentModal(rid){
 if(!requirePay())return;
 const r=state.rounds.find(x=>x.id===rid);
 if(!r||r.closed)return handleError(new Error(t('notAllowedClosed')));
 if(!r.allocations.length)return toast(t('noAllocations'),true);
 openModal(`<h2>${t('addPayment')}</h2>
   <div class="field"><label>${t('selectSection')}</label>
     <select id="pSec">${r.allocations.map(a=>{const expected=a.count*a.rate,paid=allocationPaid(r,a),rem=Math.max(0,expected-paid);return `<option value="${a.id}" data-rem="${rem}">${esc(sectionName(a))} — ${t('remaining')}: ${money(rem)}</option>`}).join('')}</select>
   </div>
   <div class="field" style="margin-top:12px"><label>${t('paidAmount')}</label><input id="pAmt" type="number" min="0.01" step="0.01"></div>
   <div class="field" style="margin-top:12px"><label>${t('photoProof')}</label><input id="pPhoto" type="file" accept="image/*" capture="environment"></div>
   <div class="field" style="margin-top:12px"><label>${t('notes')}</label><textarea id="pNotes"></textarea></div>
   <div class="footer-note">Receiver: Site Manager${r.siteManagerName?` · ${esc(r.siteManagerName)}`:''}. Date: ${r.disbursementDate?fmtDate(r.disbursementDate):fmtDate(r.coverageStart)}.</div>
   <div class="actions" style="margin-top:16px"><button class="btn" id="pCancel">${t('cancel')}</button><button class="btn primary" id="pSave">${t('save')}</button></div>`);
 const sec=document.getElementById('pSec'),amt=document.getElementById('pAmt');
 function setDefault(){const o=sec.selectedOptions[0];amt.value=Number(o.dataset.rem).toFixed(2)}
 setDefault();sec.onchange=setDefault;
 document.getElementById('pCancel').onclick=closeModal;
 document.getElementById('pSave').onclick=async()=>{
   const allocationId=sec.value,a=r.allocations.find(x=>x.id===allocationId),amount=Number(amt.value)||0,remaining=Math.max(0,a.count*a.rate-allocationPaid(r,a));
   if(amount<=0)return toast(t('amountRequired'),true);
   if(amount>remaining+0.005)return toast(t('overpay'),true);
   try{
     disableModal(true);
     const pid=uid();let proofPath=null;
     const file=document.getElementById('pPhoto').files[0];if(file)proofPath=await uploadProofFile(r.id,pid,file);
     const {error}=await SB.from('ration_payments').insert({
       id:pid,round_id:r.id,allocation_id:a.id,section_name_snapshot:a.name,amount_usd:amount,
       receiver:r.siteManagerName||'Site Manager',
       payment_date:r.disbursementDate||r.coverageStart,
       notes:document.getElementById('pNotes').value.trim(),proof_path:proofPath,created_by:null
     });
     if(error){if(proofPath)await SB.storage.from(PROOF_BUCKET).remove([proofPath]);throw error}
     closeModal();toast(t('paymentSaved'));await loadAll(false);renderRound(r.id)
   }catch(e){handleError(e);disableModal(false)}
 }
}
async function uploadProofFile(roundId,paymentId,file){if(!file.type.startsWith('image/'))throw new Error('Proof must be an image');const blob=await compressImage(file);const path=`${roundId}/${paymentId}-${Date.now()}.jpg`;const {error}=await SB.storage.from(PROOF_BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;return path}
async function compressImage(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onerror=reject;rd.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error('Image conversion failed')),'image/jpeg',.78)};img.src=rd.result};rd.readAsDataURL(file)})}
async function uploadProofForExisting(r,pid,file){if(!requirePay())return;if(!file)return;try{const p=r.payments.find(x=>x.id===pid);const old=p.proofPath;const path=await uploadProofFile(r.id,pid,file);const {error}=await SB.from('ration_payments').update({proof_path:path}).eq('id',pid);if(error){await SB.storage.from(PROOF_BUCKET).remove([path]);throw error}if(old)await SB.storage.from(PROOF_BUCKET).remove([old]);toast(t('proofUploaded'));await loadAll(false);renderRound(r.id)}catch(e){handleError(e)}}
async function viewProof(path){try{const {data,error}=await SB.storage.from(PROOF_BUCKET).createSignedUrl(path,300);if(error)throw error;openModal(`<h2>${t('photoProof')}</h2><img class="proof-view" src="${esc(data.signedUrl)}" alt="Payment proof"><div class="actions" style="margin-top:14px"><button class="btn" id="proofClose">${t('cancel')}</button></div>`);document.getElementById('proofClose').onclick=closeModal}catch(e){handleError(e)}}
async function deletePayment(r,pid){if(!requireAdmin())return;if(!confirm(t('confirmDelete')))return;try{const p=r.payments.find(x=>x.id===pid);const {error}=await SB.from('ration_payments').delete().eq('id',pid);if(error)throw error;if(p?.proofPath)await SB.storage.from(PROOF_BUCKET).remove([p.proofPath]);await loadAll(false);renderRound(r.id)}catch(e){handleError(e)}}

async function shareText(text){if(navigator.share){try{await navigator.share({title:'BL3 Ration Control',text});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);toast('Summary copied')}catch(e){openModal(`<h2>${t('share')}</h2><textarea style="width:100%;min-height:220px">${esc(text)}</textarea><button class="btn" id="shareClose" style="margin-top:10px">${t('cancel')}</button>`);document.getElementById('shareClose').onclick=closeModal}}
function shareRound(r){const x=roundTotals(r);shareText(`${state.settings.site} — ${t('reportText')}\n${t('roundLabel')} ${chronologicalRoundNumber(r)}: ${fmtDate(r.coverageStart)} → ${fmtDate(r.coverageEnd)}\n${t('status')}: ${statusLabel(x.status)}\n${x.people} ${t('people')}\n${t('approved')}: ${money(x.approved)} / ${fc(x.approved*r.fx)}\n${t('paid')}: ${money(x.paid)}\n${t('remaining')}: ${money(x.remaining)}\n${t('proof')}: ${x.proofs}/${r.payments.length}`)}

function renderReports(){
 const root=document.getElementById('reportsView'),today=new Date(),iso=d=>d.toISOString().slice(0,10),defaultFrom=new Date(today);defaultFrom.setMonth(defaultFrom.getMonth()-3);
 root.innerHTML=`<div class="topbar"><div><h1>${t('reports')}</h1><div class="meta">${state.settings.site} · ${u('systemTitle')}</div></div><div class="actions"><button class="btn" id="reportsHome">← ${u('back')}</button><button class="btn" id="reportsPrint">🖨 ${t('print')}</button></div></div><div class="panel"><div class="field"><label>${t('summaryPeriod')}</label><select id="summaryRange"><option value="all">${t('summaryAll')}</option><option value="1m">${t('summary1m')}</option><option value="3m" selected>${t('summary3m')}</option><option value="5m">${t('summary5m')}</option><option value="1y">${t('summary1y')}</option><option value="custom">${t('summaryCustom')}</option></select></div><div id="summaryCustomDates" class="grid2 hidden" style="margin-top:12px"><div class="field"><label>${t('summaryFrom')}</label><input id="summaryFrom" type="date" value="${iso(defaultFrom)}"></div><div class="field"><label>${t('summaryTo')}</label><input id="summaryTo" type="date" value="${iso(today)}"></div></div><button class="btn primary" id="summaryApply" style="margin-top:12px">${t('summaryApply')}</button></div><div id="summaryBody"></div><div class="dev-footer">Developed by Nelson Moraro</div>`;
 function chosen(){const mode=document.getElementById('summaryRange').value;if(mode==='all')return state.rounds.slice();let to=new Date(),from=new Date(to);if(mode==='custom'){const f=document.getElementById('summaryFrom').value,z=document.getElementById('summaryTo').value;from=f?new Date(f+'T00:00:00'):new Date('1970-01-01');to=z?new Date(z+'T23:59:59'):new Date()}else{const m=mode==='1m'?1:mode==='3m'?3:mode==='5m'?5:12;from.setMonth(from.getMonth()-m)}return state.rounds.filter(r=>{const d=new Date((r.disbursementDate||r.coverageStart)+'T12:00:00');return d>=from&&d<=to})}
 function draw(){const rows=chosen();let allocated=0,spent=0,workers=0;rows.forEach(r=>{const x=roundTotals(r);allocated+=x.approved;spent+=x.paid;workers+=x.people});const outstanding=Math.max(0,allocated-spent);document.getElementById('summaryBody').innerHTML=rows.length?`<div class="salary-summary summary-analytics" style="margin-top:16px"><div class="metric"><div class="label">${t('summarySpent')}</div><div class="value">${money(spent)}</div></div><div class="metric"><div class="label">${t('summaryAllocated')}</div><div class="value">${money(allocated)}</div></div><div class="metric"><div class="label">${t('summaryOutstanding')}</div><div class="value">${money(outstanding)}</div></div><div class="metric"><div class="label">${t('summaryWorkers')}</div><div class="value">${workers}</div></div><div class="metric"><div class="label">${t('summaryRounds')}</div><div class="value">${rows.length}</div></div></div><div class="panel" style="margin-top:16px"><div class="table-wrap"><table><thead><tr><th>Site</th><th>${t('roundLabel')}</th><th>${t('period')}</th><th>${t('people')}</th><th>${t('approved')}</th><th>${t('paid')}</th><th>${t('remaining')}</th></tr></thead><tbody>${rows.map(r=>{const x=roundTotals(r);return `<tr><td>${esc(r.siteName||state.settings.site||'BL3')}</td><td>${chronologicalRoundNumber(r)}</td><td>${fmtDate(r.coverageStart)} → ${fmtDate(r.coverageEnd)}</td><td>${x.people}</td><td>${money(x.approved)}</td><td>${money(x.paid)}</td><td>${money(x.remaining)}</td></tr>`}).join('')}</tbody></table></div></div>`:`<div class="panel" style="margin-top:16px">${t('summaryEmpty')}</div>`}
 document.getElementById('summaryRange').onchange=e=>document.getElementById('summaryCustomDates').classList.toggle('hidden',e.target.value!=='custom');document.getElementById('summaryApply').onclick=draw;document.getElementById('reportsHome').onclick=()=>showView('homeView');document.getElementById('reportsPrint').onclick=()=>window.print();draw()
}
function renderSettings(){const root=document.getElementById('settingsView');const editable=canAdmin();root.innerHTML=`<div class="topbar"><div><h1>${t('settings')}</h1><div class="meta">${roleLabel()}</div></div><div class="actions"><select id="settingsLang" class="btn"><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option><option value="ln">Lingala</option></select><button class="btn" id="settingsHome">← ${u('back')}</button></div></div><div class="panel"><div class="grid2"><div class="field"><label>${t('siteName')}</label><input id="siteName" value="${esc(state.settings.site)}" ${editable?'':'disabled'}></div><div class="field"><label>${t('defaultFx')}</label><input id="defaultFx" type="number" min="1" step="0.01" value="${state.settings.fx}" ${editable?'':'disabled'}></div><div class="field"><label>${t('cycleDays')}</label><input id="cycleDays" type="number" min="1" max="60" value="${state.settings.cycleDays}" ${editable?'':'disabled'}></div></div>${editable?`<button class="btn primary" id="saveSettings" style="margin-top:14px">${t('saveSettings')}</button>`:''}</div>`;document.getElementById('settingsLang').value=langCode;document.getElementById('settingsLang').onchange=e=>{langCode=e.target.value;localStorage.setItem('bl3_lang',langCode);renderSettings()};document.getElementById('settingsHome').onclick=()=>showView('homeView');const ss=document.getElementById('saveSettings');if(ss)ss.onclick=async()=>{try{const site=document.getElementById('siteName').value.trim()||'BL3',fx=Number(document.getElementById('defaultFx').value)||2200,days=Math.max(1,Math.min(60,Number(document.getElementById('cycleDays').value)||14));const {error}=await SB.from('ration_settings').update({site_name:site,default_fx:fx,cycle_days:days}).eq('id',1);if(error)throw error;toast(t('settingsSaved'));await loadAll(false);renderSettings()}catch(e){handleError(e)}}}

function renderAuth(message='',isErr=false){window.__BL3_BOOT_DONE=true;bootFinished=true;clearTimeout(bootWatchdog);const rs=document.getElementById('roleSync');if(rs)rs.classList.add('hidden');document.getElementById('appRoot').classList.add('hidden');const root=document.getElementById('authRoot');root.classList.remove('hidden');const c=accessCopy();root.innerHTML=`<div class="auth-card"><div class="access-kicker">${c.kicker}</div><h1>${c.title}</h1><div class="muted">${c.intro}</div>${message?`<div class="auth-msg ${isErr?'auth-error':''}">${esc(message)}</div>`:''}<div class="lang-grid"><button type="button" class="lang-btn ${langCode==='fr'?'active':''}" data-lang="fr">Français</button><button type="button" class="lang-btn ${langCode==='en'?'active':''}" data-lang="en">English</button><button type="button" class="lang-btn ${langCode==='zh'?'active':''}" data-lang="zh">中文</button><button type="button" class="lang-btn ${langCode==='ln'?'active':''}" data-lang="ln">Lingala</button></div><form id="authForm"><div class="field"><div class="access-row"><input id="accessCode" class="access-code" type="password" autocomplete="off" placeholder="${c.code}" required><button class="btn" type="button" id="pasteAccessCode">Paste code</button></div></div><button class="btn primary" type="submit">${c.open}</button></form><div class="footer-note">Tip: copy the access code from WhatsApp, then tap <strong>Paste code</strong>.</div><div class="footer-note">BL3 food ration / food-money disbursement control · 14-day rounds · payment photo proof</div><div class="dev-footer">Developed by Nelson Moraro</div></div>`;root.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{langCode=b.dataset.lang;localStorage.setItem('bl3_lang',langCode);renderAuth(message,isErr)});
const pasteBtn=document.getElementById('pasteAccessCode');if(pasteBtn)pasteBtn.onclick=async()=>{try{const txt=await navigator.clipboard.readText();document.getElementById('accessCode').value=(txt||'').trim().toUpperCase();toast('Access code pasted')}catch(e){toast('Clipboard access is blocked. Long-press the code in WhatsApp, copy it, then paste here.',true)}};
document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter||document.querySelector('#authForm button'),code=document.getElementById('accessCode').value.trim().toUpperCase();try{btn.disabled=true;const u=new URL(location.href),scope=u.searchParams.get('scope')==='round'?'round':'site',roundId=scope==='round'?u.searchParams.get('round'):null;const res=await withTimeout(fetch(ACCESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessCode:code,scope,roundId})}),10000,'Sign in');const out=await res.json().catch(()=>({}));if(!res.ok||!out.role)throw new Error(out.error||c.bad);state.role=out.role;state.scope=out.scope||scope;state.scopeRoundId=out.roundId||roundId;localStorage.setItem('bl3_ration_role',out.role);localStorage.setItem('bl3_ration_access_code',code);localStorage.setItem('bl3_ration_scope',state.scope);if(state.scopeRoundId)localStorage.setItem('bl3_ration_round_id',state.scopeRoundId);else localStorage.removeItem('bl3_ration_round_id');await enterApp()}catch(err){renderAuth(err.message||c.bad,true)}}}
function applyRoleUI(){const nr=document.getElementById('newRoundSide');if(nr)nr.classList.toggle('hidden',!canAdmin());const settingsBtn=[...document.querySelectorAll('[data-view="settings"]')][0];if(settingsBtn)settingsBtn.classList.toggle('hidden',!canAdmin());document.getElementById('userEmail').textContent=roleLabel()}
async function enterApp(){window.__BL3_BOOT_DONE=true;bootFinished=true;clearTimeout(bootWatchdog);state.session=true;state.role=state.role||localStorage.getItem('bl3_ration_role');document.getElementById('authRoot').classList.add('hidden');document.getElementById('appRoot').classList.remove('hidden');applyRoleUI();activeView='home';try{await loadAll(true);if(isRoundScope()&&state.rounds.length)openRound(state.scopeRoundId);setupRealtime()}catch(e){console.error(e);renderLoadFailure(e.message||'The app could not finish loading.')}}
async function signOut(){state.session=null;state.role=null;localStorage.removeItem('bl3_ration_role');localStorage.removeItem('bl3_ration_access_code');localStorage.removeItem('bl3_ration_scope');localStorage.removeItem('bl3_ration_round_id');state.scope='site';state.scopeRoundId=null;renderAuth()}
let realtimeChannel=null;function setupRealtime(){if(realtimeChannel)SB.removeChannel(realtimeChannel);realtimeChannel=SB.channel('ration-sync').on('postgres_changes',{event:'*',schema:'public',table:'ration_rounds'},scheduleRefresh).on('postgres_changes',{event:'*',schema:'public',table:'ration_allocations'},scheduleRefresh).on('postgres_changes',{event:'*',schema:'public',table:'ration_payments'},scheduleRefresh).on('postgres_changes',{event:'*',schema:'public',table:'ration_master_sections'},scheduleRefresh).subscribe()}
function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>loadAll(false),350)}


function renderBootRecovery(message='The app is taking too long to start.'){
 const auth=document.getElementById('authRoot'),app=document.getElementById('appRoot');
 if(auth)auth.classList.add('hidden');
 if(app)app.classList.remove('hidden');
 activeView='home';
 const root=document.getElementById('homeView');
 if(!root)return;
 root.innerHTML=`<div class="auth-wrap" style="min-height:75vh"><div class="auth-card">
   <h1>Startup recovery</h1>
   <div class="auth-msg auth-error">${esc(message)}</div>
   <button class="btn primary" id="bootRetry">Retry connection</button>
   <button class="btn" id="bootUseCache">Open cached data</button>
   <button class="btn" id="bootLogin">Return to access code</button>
   <div class="footer-note">The app will not remain stuck on Loading.</div>
   <div class="dev-footer">Developed by Nelson Moraro</div>
 </div></div>`;
 document.getElementById('bootRetry').onclick=()=>location.reload();
 document.getElementById('bootUseCache').onclick=()=>{const had=loadCache();if(had){state.session=true;state.role=state.role||localStorage.getItem('bl3_ration_role')||'viewer';applyRoleUI();renderHome()}else toast('No cached data is available on this device.',true)};
 document.getElementById('bootLogin').onclick=()=>{localStorage.removeItem('bl3_ration_access_code');localStorage.removeItem('bl3_ration_role');state.role=null;renderAuth()};
}
let bootFinished=false;
window.addEventListener('error',e=>{console.error('Startup/runtime error',e.error||e.message);if(!bootFinished)renderBootRecovery(e.message||'The app could not start.')});
window.addEventListener('unhandledrejection',e=>{console.error('Unhandled promise rejection',e.reason);if(!bootFinished)renderBootRecovery(e.reason?.message||'The app could not start.')});
const bootWatchdog=setTimeout(()=>{if(!bootFinished)renderBootRecovery('Connection or session restore is taking too long.')},6000);

window.addEventListener('online',()=>{setConnectivity();if(state.role)loadAll(false)});window.addEventListener('offline',setConnectivity);
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)showView(b.dataset.view+'View')});
document.getElementById('newRoundSide').onclick=()=>roundModal();document.getElementById('signOutSide').onclick=signOut;document.getElementById('mobileHome').onclick=()=>showView('homeView');
/* v29 service worker registration handled in head */
(async()=>{
 setConnectivity();
 const savedCode=localStorage.getItem('bl3_ration_access_code');
 if(!savedCode){renderAuth();return}
 try{
   const urlObj=new URL(location.href),urlRound=urlObj.searchParams.get('scope')==='round'?urlObj.searchParams.get('round'):null,
         scope=urlRound?'round':(localStorage.getItem('bl3_ration_scope')||'site'),
         roundId=urlRound||localStorage.getItem('bl3_ration_round_id');
   const res=await withTimeout(fetch(ACCESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessCode:savedCode,scope,roundId})}),4500,'Session restore');
   const out=await res.json().catch(()=>({}));
   if(res.ok&&out.role){
     state.role=out.role;state.scope=out.scope||scope;state.scopeRoundId=out.roundId||roundId;
     localStorage.setItem('bl3_ration_role',out.role);localStorage.setItem('bl3_ration_scope',state.scope);
     if(state.scopeRoundId)localStorage.setItem('bl3_ration_round_id',state.scopeRoundId);
     await enterApp();return;
   }
 }catch(e){
   console.warn('Session restore failed',e);
   const cachedRole=localStorage.getItem('bl3_ration_role');
   const had=loadCache();
   if(had&&cachedRole){
     state.role=cachedRole;state.session=true;bootFinished=true;clearTimeout(bootWatchdog);
     document.getElementById('authRoot').classList.add('hidden');document.getElementById('appRoot').classList.remove('hidden');
     applyRoleUI();activeView='home';renderHome();toast('Live connection failed. Showing cached data.',true);return;
   }
 }
 localStorage.removeItem('bl3_ration_role');localStorage.removeItem('bl3_ration_access_code');
 renderAuth('Session expired. Enter your access code again.',true);
})();
</script>
