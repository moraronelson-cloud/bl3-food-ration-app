function t(k){return (I18N[langCode]&&I18N[langCode][k])||I18N.en[k]||k}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v){return '$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function fc(v){return Math.round(Number(v||0)).toLocaleString()+' FC'}
function fmtDate(s){if(!s)return '—';const d=new Date(s+'T12:00:00');return d.toLocaleDateString(langCode==='zh'?'zh-CN':langCode==='fr'?'fr-FR':'en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function uid(){return crypto.randomUUID?crypto.randomUUID():(Date.now()+'-'+Math.random()).replace('.','')}
function addDays(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function isOnline(){return navigator.onLine}
function setConnectivity(){const off=!isOnline();['desktopOnline','mobileOnline'].forEach(id=>{const e=document.getElementById(id);if(e){e.classList.toggle('off',off);e.textContent=off?t('offline'):t('online')}})}

function mapData(roundRows,allocRows,payRows){
 const byRound=new Map(roundRows.map(r=>[r.id,{id:r.id,site:r.site_name,coverageStart:r.coverage_start,coverageEnd:r.coverage_end,disbursementDate:r.disbursement_date,fx:Number(r.fx),closed:r.closed,notes:r.notes||'',createdAt:r.created_at,updatedAt:r.updated_at,allocations:[],payments:[]} ]));
 allocRows.forEach(a=>{const r=byRound.get(a.round_id);if(r)r.allocations.push({id:a.id,name:a.section_name,count:a.headcount,rate:Number(a.rate_usd),sort:a.sort_order})});
 payRows.forEach(p=>{const r=byRound.get(p.round_id);if(r)r.payments.push({id:p.id,allocationId:p.allocation_id,section:p.section_name_snapshot,amount:Number(p.amount_usd),receiver:p.receiver||'',date:p.payment_date,notes:p.notes||'',proofPath:p.proof_path,createdAt:p.created_at,updatedAt:p.updated_at})});
 byRound.forEach(r=>r.allocations.sort((a,b)=>a.sort-b.sort||a.name.localeCompare(b.name)));
 state.rounds=[...byRound.values()].sort((a,b)=>b.coverageStart.localeCompare(a.coverageStart));
}
function cacheState(){localStorage.setItem(CACHE_KEY,JSON.stringify({settings:state.settings,rounds:state.rounds,savedAt:new Date().toISOString()}))}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY));if(c){state.settings=c.settings||state.settings;state.rounds=c.rounds||[];return true}}catch(e){}return false}

async function loadAll(showLoading=true){
 if(showLoading)showBusy();
 if(!isOnline()){loadCache();renderActive();return}
 try{
  const [s,r,a,p]=await Promise.all([
   SB.from('ration_settings').select('*').eq('id',1).single(),
   SB.from('ration_rounds').select('*').order('coverage_start',{ascending:false}),
   SB.from('ration_allocations').select('*').order('sort_order',{ascending:true}),
   SB.from('ration_payments').select('*').order('payment_date',{ascending:true})
  ]);
  for(const x of [s,r,a,p])if(x.error)throw x.error;
  state.settings={site:s.data.site_name,fx:Number(s.data.default_fx),cycleDays:s.data.cycle_days};
  mapData(r.data||[],a.data||[],p.data||[]);cacheState();
 }catch(err){console.error(err);loadCache();toast(t('syncError'),true)}
 renderActive();
}
function showBusy(){const target=activeView==='round'?document.getElementById('roundView'):document.getElementById(activeView+'View');if(target)target.innerHTML='<div class="loading">'+esc(t('syncing'))+'</div>'}
function roundTotals(r){
 const approved=r.allocations.reduce((s,a)=>s+a.count*a.rate,0), people=r.allocations.reduce((s,a)=>s+a.count,0), paid=r.payments.reduce((s,p)=>s+p.amount,0), proofs=r.payments.filter(p=>p.proofPath).length, missingProof=r.payments.filter(p=>p.amount>0&&!p.proofPath).length;
 const remaining=Math.max(0,approved-paid);let status='not';if(paid>0)status=(approved>0&&paid>=approved-0.005&&missingProof===0)?'done':'partial';
 return{approved,people,paid,remaining,proofs,missingProof,status};
}
function statusClass(s){return s==='done'?'good':s==='partial'?'warn':'bad'}
function statusLabel(s){return s==='done'?t('disbursed'):s==='partial'?t('partial'):t('notDisbursed')}
function chronologicalRoundNumber(r){const asc=[...state.rounds].sort((a,b)=>a.coverageStart.localeCompare(b.coverageStart));return asc.findIndex(x=>x.id===r.id)+1}
function currentRound(){const today=new Date().toISOString().slice(0,10);return state.rounds.find(r=>r.coverageStart<=today&&r.coverageEnd>=today)||state.rounds[0]||null}

function applyI18n(root=document){root.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)})}
function showView(v){activeView=v==='roundView'?'round':v.replace('View','');['homeView','roundView','reportsView','settingsView'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==v));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));renderActive()}
function renderActive(){setConnectivity();if(activeView==='home')renderHome();else if(activeView==='round'&&currentRoundId)renderRound(currentRoundId);else if(activeView==='reports')renderReports();else if(activeView==='settings')renderSettings()}

function topActions(){return `<select id="langSelect" class="btn"><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option><option value="ln">Lingala</option></select><button class="btn" id="refreshBtn">↻ ${t('refresh')}</button><button class="btn" id="shareHome">↗ ${t('share')}</button>${canAdmin()?`<button class="btn primary" id="newRoundTop">+ ${t('newRound')}</button>`:''}`}
function renderHome(){
 const root=document.getElementById('homeView'), cur=currentRound();let allApproved=0,unpaid=0;state.rounds.forEach(r=>{const x=roundTotals(r);allApproved+=x.approved;if(x.status!=='done')unpaid++});
 root.innerHTML=`<div class="topbar"><div><h1>${t('rationRounds')}</h1><div class="meta">${t('homeSubtitle')}</div></div><div class="actions">${topActions()}</div></div>${!isOnline()?`<div class="alert">${t('dataCached')}</div>`:''}<div class="summary"><div class="metric"><div class="label">${t('currentRound')}</div><div class="value">${cur?fmtDate(cur.coverageStart)+' → '+fmtDate(cur.coverageEnd):'—'}</div></div><div class="metric"><div class="label">${t('totalRounds')}</div><div class="value">${state.rounds.length}</div></div><div class="metric"><div class="label">${t('totalApproved')}</div><div class="value">${money(allApproved)}</div></div><div class="metric"><div class="label">${t('unpaidRounds')}</div><div class="value">${unpaid}</div></div></div><div class="section-title"><div><h2>${t('allRounds')}</h2><div class="muted">${t('proofRequired')}</div></div>${canAdmin()?`<button class="btn" id="historicalBtn">+ ${t('addHistorical')}</button>`:''}</div><div class="cards" id="roundCards">${state.rounds.length?state.rounds.map(r=>roundCard(r,cur&&cur.id===r.id)).join(''):`<div class="panel">${t('noData')}</div>`}</div>`;
 wireGlobalTop();const hb=document.getElementById('historicalBtn');if(hb)hb.onclick=()=>roundModal(null,true);root.querySelectorAll('.round').forEach(c=>c.onclick=()=>openRound(c.dataset.rid));
}
function roundCard(r,isCurrent){const x=roundTotals(r),n=chronologicalRoundNumber(r);return `<article class="round ${isCurrent?'current':''}" data-rid="${r.id}"><div class="status ${statusClass(x.status)}"><span class="dot"></span>${statusLabel(x.status)} ${isCurrent?`· ${t('current')}`:''}</div><div class="period">${t('roundLabel')} ${n}: ${fmtDate(r.coverageStart)} → ${fmtDate(r.coverageEnd)}</div><div class="meta">${x.people} ${t('people')} · <span class="money">${money(x.approved)}</span> · ${fc(x.approved*r.fx)}</div><div class="round-line"><span>${t('paid')}: <b>${money(x.paid)}</b></span><span>${t('remaining')}: <b>${money(x.remaining)}</b></span></div><div class="proof-chip">📷 ${x.proofs}/${r.payments.length} ${t('proofs')}${x.missingProof?` · ${x.missingProof} ${t('paymentMissingProof')}`:''}</div></article>`}
function wireGlobalTop(){const ls=document.getElementById('langSelect');if(ls){ls.value=langCode;ls.onchange=e=>{langCode=e.target.value;localStorage.setItem('bl3_lang',langCode);renderActive()}}const r=document.getElementById('refreshBtn');if(r)r.onclick=()=>loadAll(true);const sh=document.getElementById('shareHome');if(sh)sh.onclick=()=>shareText(`${state.settings.site} — ${t('reportText')}\n${state.rounds.length} ${t('rounds')}`);const nr=document.getElementById('newRoundTop');if(nr)nr.onclick=()=>roundModal()}

function openRound(id){currentRoundId=id;activeView='round';['homeView','reportsView','settingsView'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById('roundView').classList.remove('hidden');renderRound(id)}
function renderRound(id,tab='overview'){const r=state.rounds.find(x=>x.id===id);if(!r){showView('homeView');return}const x=roundTotals(r),n=chronologicalRoundNumber(r),root=document.getElementById('roundView');root.innerHTML=`<div class="topbar"><div><button class="btn small" id="backHome">← ${t('home')}</button><h1 style="margin-top:10px">${t('roundLabel')} ${n}: ${fmtDate(r.coverageStart)} → ${fmtDate(r.coverageEnd)}</h1><div class="status ${statusClass(x.status)}" style="margin-top:8px"><span class="dot"></span>${statusLabel(x.status)}</div></div><div class="actions"><button class="btn" id="shareRound">↗ ${t('share')}</button><button class="btn" id="printRound">🖨 ${t('print')}</button>${canAdmin()?(r.closed?`<button class="btn warn" id="reopenRound">${t('reopenRound')}</button>`:`<button class="btn" id="editRound">${t('editRound')}</button><button class="btn" id="nextRound">${t('duplicateNext')}</button><button class="btn primary" id="closeRound">${t('closeRound')}</button>`):''}</div></div>${r.closed?`<div class="locked-banner">🔒 ${t('locked')}</div>`:''}<div class="summary"><div class="metric"><div class="label">${t('status')}</div><div class="value" style="font-size:17px">${statusLabel(x.status)}</div></div><div class="metric"><div class="label">${t('people')}</div><div class="value">${x.people}</div></div><div class="metric"><div class="label">${t('approved')}</div><div class="value">${money(x.approved)}</div><div class="meta">${fc(x.approved*r.fx)}</div></div><div class="metric"><div class="label">${t('paid')} / ${t('remaining')}</div><div class="value">${money(x.paid)} / ${money(x.remaining)}</div></div></div>${x.missingProof?`<div class="alert">📷 ${x.missingProof} ${t('paymentMissingProof')}. ${t('proofRequired')}</div>`:''}<div class="panel"><div class="tabs"><button class="tab ${tab==='overview'?'active':''}" data-tab="overview">${t('overview')}</button><button class="tab ${tab==='alloc'?'active':''}" data-tab="alloc">${t('allocations')}</button><button class="tab ${tab==='pay'?'active':''}" data-tab="pay">${t('paymentsProof')}</button><button class="tab ${tab==='notes'?'active':''}" data-tab="notes">${t('notesHistory')}</button><button class="tab ${tab==='audit'?'active':''}" data-tab="audit">${t('audit')}</button></div><div id="tabBody"></div></div>`;
 document.getElementById('backHome').onclick=()=>showView('homeView');document.getElementById('shareRound').onclick=()=>shareRound(r);document.getElementById('printRound').onclick=()=>window.print();const rr=document.getElementById('reopenRound'),er=document.getElementById('editRound'),nr=document.getElementById('nextRound'),cr=document.getElementById('closeRound');if(rr)rr.onclick=()=>setRoundClosed(r,false);if(er)er.onclick=()=>roundModal(r.id);if(nr)nr.onclick=()=>duplicateNext(r);if(cr)cr.onclick=()=>{if(confirm(t('confirmClose')))setRoundClosed(r,true)};root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderRound(r.id,b.dataset.tab));renderTab(r,tab);
}
function renderTab(r,tab){const body=document.getElementById('tabBody');if(tab==='overview')body.innerHTML=overviewHtml(r);else if(tab==='alloc')body.innerHTML=allocHtml(r);else if(tab==='pay')body.innerHTML=paymentsHtml(r);else if(tab==='notes')body.innerHTML=notesHtml(r);else auditHtml(r,body);wireTab(r,tab)}
function overviewHtml(r){const x=roundTotals(r);return `<div class="grid2"><div><p><b>${t('period')}:</b><br>${fmtDate(r.coverageStart)} → ${fmtDate(r.coverageEnd)}</p><p><b>${t('disbursementDate')}:</b><br>${fmtDate(r.disbursementDate)}</p><p><b>${t('exchangeRate')}:</b><br>${Number(r.fx).toLocaleString()} FC/USD</p></div><div><p><b>${t('approved')}:</b><br>${money(x.approved)} · ${fc(x.approved*r.fx)}</p><p><b>${t('paid')}:</b><br>${money(x.paid)}</p><p><b>${t('proof')}:</b><br>${x.proofs}/${r.payments.length}</p></div></div><div class="alert ${x.status==='done'?'ok-alert':''}">${t('proofRequired')}</div>`}
function allocationPaid(r,a){return r.payments.filter(p=>p.allocationId===a.id).reduce((s,p)=>s+p.amount,0)}
function allocHtml(r){const editable=canAdmin()&&!r.closed;return `<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px"><h2>${t('allocations')}</h2>${editable?`<button class="btn" id="addSection">+ ${t('addSection')}</button>`:''}</div>${r.allocations.length?`<div class="table-wrap"><table><thead><tr><th>${t('section')}</th><th>${t('headcount')}</th><th>${t('rate')}</th><th>${t('expected')}</th><th>${t('sectionPaid')}</th><th>${t('sectionRemaining')}</th><th></th></tr></thead><tbody>${r.allocations.map(a=>{const ap=a.count*a.rate,p=allocationPaid(r,a),rem=Math.max(0,ap-p);return `<tr data-aid="${a.id}"><td>${editable?`<input class="a-name" value="${esc(a.name)}">`:esc(a.name)}</td><td>${editable?`<input class="a-count" type="number" min="0" value="${a.count}">`:a.count}</td><td>${editable?`<input class="a-rate" type="number" min="0" step="0.01" value="${a.rate}">`:money(a.rate)}</td><td>${money(ap)}</td><td>${money(p)}</td><td>${money(rem)}</td><td>${editable?`<button class="btn small danger delA" ${p>0?'disabled title="Payment exists"':''}>${t('delete')}</button>`:''}</td></tr>`}).join('')}</tbody></table></div>${editable?`<button class="btn primary" id="saveAlloc" style="margin-top:12px">${t('save')}</button>`:''}`:`<div class="muted">${t('noAllocations')}</div>`}`}
function paymentsHtml(r){const payable=canPay()&&!r.closed,adminDelete=canAdmin()&&!r.closed;return `<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px"><h2>${t('paymentsProof')}</h2>${payable?`<button class="btn" id="addPay">+ ${t('addPayment')}</button>`:''}</div>${r.payments.length?`<div class="table-wrap"><table><thead><tr><th>${t('section')}</th><th>${t('paidAmount')}</th><th>${t('receiver')}</th><th>${t('paymentDate')}</th><th>${t('photoProof')}</th><th></th></tr></thead><tbody>${r.payments.map(p=>`<tr data-pid="${p.id}"><td>${esc(p.section)}</td><td>${money(p.amount)}</td><td>${esc(p.receiver||'—')}</td><td>${fmtDate(p.date)}</td><td><div class="proof" id="proof-${p.id}">${p.proofPath?`<button class="btn small viewProof" data-path="${esc(p.proofPath)}">📷 ${t('viewProof')}</button><span class="badge">✓ ${t('proof')}</span>`:`<span class="badge">${t('photoProof')}: —</span>`}${payable?`<label class="btn small">${p.proofPath?t('replaceProof'):t('upload')}<input class="proofInput hidden" type="file" accept="image/*" capture="environment"></label>`:''}</div></td><td>${adminDelete?`<button class="btn small danger delP">${t('delete')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="muted">${t('noPayments')}</div>`}`}
function notesHtml(r){const editable=canAdmin()&&!r.closed;return `<h2>${t('notesHistory')}</h2>${editable?`<textarea id="roundNotes" style="width:100%;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:10px">${esc(r.notes||'')}</textarea><button class="btn primary" id="saveNotes" style="margin-top:10px">${t('save')}</button>`:`<div>${esc(r.notes||'—')}</div>`}<p class="footer-note">${t('created')}: ${new Date(r.createdAt).toLocaleString()} · ${t('updated')}: ${new Date(r.updatedAt).toLocaleString()}</p>`}
async function auditHtml(r,body){body.innerHTML='<div class="loading">'+t('syncing')+'</div>';const {data,error}=await SB.from('ration_audit_log').select('id,actor_id,table_name,operation,row_id,created_at').eq('round_id',r.id).order('created_at',{ascending:false}).limit(100);if(error){body.innerHTML='<div class="alert">'+esc(error.message)+'</div>';return}body.innerHTML=`<h2>${t('audit')}</h2><div class="table-wrap"><table><thead><tr><th>${t('updated')}</th><th>${t('action')}</th><th>${t('section')}</th><th>${t('user')}</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.operation)}</td><td>${esc(x.table_name)}</td><td>${esc(x.actor_id||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function wireTab(r,tab){const body=document.getElementById('tabBody');if(tab==='alloc'&&canAdmin()&&!r.closed){const add=document.getElementById('addSection');if(add)add.onclick=()=>addSection(r);const save=document.getElementById('saveAlloc');if(save)save.onclick=()=>saveAllocations(r);body.querySelectorAll('.delA').forEach(b=>b.onclick=()=>deleteAllocation(r,b.closest('tr').dataset.aid))}if(tab==='pay'){if(canPay()&&!r.closed){const add=document.getElementById('addPay');if(add)add.onclick=()=>paymentModal(r.id);body.querySelectorAll('.proofInput').forEach(inp=>inp.onchange=()=>uploadProofForExisting(r,inp.closest('tr').dataset.pid,inp.files[0]))}if(canAdmin()&&!r.closed)body.querySelectorAll('.delP').forEach(b=>b.onclick=()=>deletePayment(r,b.closest('tr').dataset.pid));body.querySelectorAll('.viewProof').forEach(b=>b.onclick=()=>viewProof(b.dataset.path))}if(tab==='notes'&&canAdmin()&&!r.closed){const s=document.getElementById('saveNotes');if(s)s.onclick=()=>saveNotes(r)}}

function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal-back"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg,isErr=false){let old=document.getElementById('appToast');if(old)old.remove();const d=document.createElement('div');d.id='appToast';d.textContent=msg;d.style.cssText=`position:fixed;right:18px;bottom:18px;z-index:200;background:${isErr?'#991b1b':'#111827'};color:white;padding:11px 14px;border-radius:10px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.2);font-size:13px`;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function handleError(err){console.error(err);let msg=err?.message||String(err);if(msg.includes('duplicate key'))msg=t('duplicatePeriod');if(msg.includes('closed'))msg=t('notAllowedClosed');toast(msg,true)}

async function roundModal(id=null,historical=false){if(!requireAdmin())return;const r=id?state.rounds.find(x=>x.id===id):null;if(r&&r.closed)return toast(t('notAllowedClosed'),true);let start,end,dd,fx;if(r){start=r.coverageStart;end=r.coverageEnd;dd=r.disbursementDate||start;fx=r.fx}else if(historical&&state.rounds.length){const oldest=[...state.rounds].sort((a,b)=>a.coverageStart.localeCompare(b.coverageStart))[0];end=addDays(oldest.coverageStart,-1);start=addDays(end,-(state.settings.cycleDays-1));dd=start;fx=state.settings.fx}else{const latest=state.rounds[0];start=latest?addDays(latest.coverageEnd,1):'2026-08-30';end=addDays(start,state.settings.cycleDays-1);dd=start;fx=latest?.fx||state.settings.fx}
 openModal(`<h2>${r?t('editRound'):historical?t('addHistorical'):t('titleNew')}</h2>${historical?`<div class="alert">${t('addHistoricalHelp')}</div>`:''}<div class="grid2"><div class="field"><label>${t('coverageStart')}</label><input id="mStart" type="date" value="${start}"></div><div class="field"><label>${t('coverageEnd')}</label><input id="mEnd" type="date" value="${end}"></div><div class="field"><label>${t('disbursementDate')}</label><input id="mDisb" type="date" value="${dd||''}"></div><div class="field"><label>${t('exchangeRate')}</label><input id="mFx" type="number" min="1" step="0.01" value="${fx}"></div></div><div class="actions" style="margin-top:16px"><button class="btn" id="mCancel">${t('cancel')}</button><button class="btn primary" id="mSave">${r?t('save'):t('create')}</button></div>`);
 document.getElementById('mCancel').onclick=closeModal;document.getElementById('mSave').onclick=async()=>{const s=document.getElementById('mStart').value,e=document.getElementById('mEnd').value,d=document.getElementById('mDisb').value,f=Number(document.getElementById('mFx').value)||state.settings.fx;if(!s||!e||s>e)return handleError(new Error('Check dates'));try{disableModal(true);if(r){const {error}=await SB.from('ration_rounds').update({coverage_start:s,coverage_end:e,disbursement_date:d||null,fx:f}).eq('id',r.id);if(error)throw error;toast(t('roundUpdated'))}else{const {data,error}=await SB.from('ration_rounds').insert({site_name:state.settings.site,coverage_start:s,coverage_end:e,disbursement_date:d||null,fx:f,closed:false,notes:historical?'Historical round.':'',created_by:state.session.user.id}).select().single();if(error)throw error;const template=chooseTemplateForNewRound(s);if(template&&template.allocations.length){const rows=template.allocations.map((a,i)=>({round_id:data.id,section_name:a.name,headcount:a.count,rate_usd:a.rate,sort_order:i}));const ins=await SB.from('ration_allocations').insert(rows);if(ins.error)throw ins.error}toast(t('roundCreated'))}closeModal();await loadAll(false);if(r)openRound(r.id);else showView('homeView')}catch(err){handleError(err);disableModal(false)}}}
function chooseTemplateForNewRound(start){if(!state.rounds.length)return null;const older=state.rounds.filter(r=>r.coverageStart<start).sort((a,b)=>b.coverageStart.localeCompare(a.coverageStart))[0];return older||state.rounds[0]}
function disableModal(v){document.querySelectorAll('#modalRoot button,#modalRoot input,#modalRoot select,#modalRoot textarea').forEach(e=>e.disabled=v)}

async function addSection(r){if(!requireAdmin())return;try{const sort=r.allocations.length?Math.max(...r.allocations.map(a=>a.sort||0))+1:0;const {error}=await SB.from('ration_allocations').insert({round_id:r.id,section_name:'New section',headcount:1,rate_usd:35,sort_order:sort});if(error)throw error;await loadAll(false);renderRound(r.id,'alloc')}catch(e){handleError(e)}}
async function saveAllocations(r){if(!requireAdmin())return;try{const trs=[...document.querySelectorAll('tr[data-aid]')];for(const tr of trs){const id=tr.dataset.aid,name=tr.querySelector('.a-name').value.trim(),count=Math.max(0,Number(tr.querySelector('.a-count').value)||0),rate=Math.max(0,Number(tr.querySelector('.a-rate').value)||0);if(!name)throw new Error('Section name is required');const {error}=await SB.from('ration_allocations').update({section_name:name,headcount:count,rate_usd:rate}).eq('id',id);if(error)throw error}await loadAll(false);renderRound(r.id,'alloc')}catch(e){handleError(e)}}
async function deleteAllocation(r,id){if(!requireAdmin())return;if(!confirm(t('confirmDelete')))return;try{const {error}=await SB.from('ration_allocations').delete().eq('id',id);if(error)throw error;await loadAll(false);renderRound(r.id,'alloc')}catch(e){handleError(e)}}
async function saveNotes(r){if(!requireAdmin())return;try{const notes=document.getElementById('roundNotes').value;const {error}=await SB.from('ration_rounds').update({notes}).eq('id',r.id);if(error)throw error;await loadAll(false);renderRound(r.id,'notes')}catch(e){handleError(e)}}
async function setRoundClosed(r,closed){if(!requireAdmin())return;try{const {error}=await SB.from('ration_rounds').update({closed}).eq('id',r.id);if(error)throw error;await loadAll(false);renderRound(r.id)}catch(e){handleError(e)}}
async function duplicateNext(r){if(!requireAdmin())return;const start=addDays(r.coverageEnd,1),end=addDays(start,state.settings.cycleDays-1);try{const {data,error}=await SB.from('ration_rounds').insert({site_name:r.site,coverage_start:start,coverage_end:end,disbursement_date:start,fx:r.fx,closed:false,notes:'',created_by:state.session.user.id}).select().single();if(error)throw error;if(r.allocations.length){const rows=r.allocations.map((a,i)=>({round_id:data.id,section_name:a.name,headcount:a.count,rate_usd:a.rate,sort_order:i}));const ins=await SB.from('ration_allocations').insert(rows);if(ins.error)throw ins.error}await loadAll(false);openRound(data.id)}catch(e){handleError(e)}}

function paymentModal(rid){if(!requirePay())return;const r=state.rounds.find(x=>x.id===rid);if(!r||r.closed)return handleError(new Error(t('notAllowedClosed')));if(!r.allocations.length)return toast(t('noAllocations'),true);openModal(`<h2>${t('addPayment')}</h2><div class="field"><label>${t('selectSection')}</label><select id="pSec">${r.allocations.map(a=>{const expected=a.count*a.rate,paid=allocationPaid(r,a),rem=Math.max(0,expected-paid);return `<option value="${a.id}" data-rem="${rem}">${esc(a.name)} — ${t('remaining')}: ${money(rem)}</option>`}).join('')}</select></div><div class="grid2" style="margin-top:12px"><div class="field"><label>${t('paidAmount')}</label><input id="pAmt" type="number" min="0.01" step="0.01"></div><div class="field"><label>${t('receiver')}</label><input id="pRec"></div><div class="field"><label>${t('paymentDate')}</label><input id="pDate" type="date" value="${r.disbursementDate||r.coverageStart}"></div><div class="field"><label>${t('photoProof')}</label><input id="pPhoto" type="file" accept="image/*" capture="environment"></div></div><div class="field" style="margin-top:12px"><label>${t('notes')}</label><textarea id="pNotes"></textarea></div><div class="footer-note">${t('photoOptional')}</div><div class="actions" style="margin-top:16px"><button class="btn" id="pCancel">${t('cancel')}</button><button class="btn primary" id="pSave">${t('save')}</button></div>`);const sec=document.getElementById('pSec'),amt=document.getElementById('pAmt');function setDefault(){const o=sec.selectedOptions[0];amt.value=Number(o.dataset.rem).toFixed(2)}setDefault();sec.onchange=setDefault;document.getElementById('pCancel').onclick=closeModal;document.getElementById('pSave').onclick=async()=>{const allocationId=sec.value,a=r.allocations.find(x=>x.id===allocationId),amount=Number(amt.value)||0,remaining=Math.max(0,a.count*a.rate-allocationPaid(r,a));if(amount<=0)return toast(t('amountRequired'),true);if(amount>remaining+0.005)return toast(t('overpay'),true);try{disableModal(true);const pid=uid();let proofPath=null;const file=document.getElementById('pPhoto').files[0];if(file)proofPath=await uploadProofFile(r.id,pid,file);const {error}=await SB.from('ration_payments').insert({id:pid,round_id:r.id,allocation_id:a.id,section_name_snapshot:a.name,amount_usd:amount,receiver:document.getElementById('pRec').value.trim(),payment_date:document.getElementById('pDate').value||r.disbursementDate||r.coverageStart,notes:document.getElementById('pNotes').value.trim(),proof_path:proofPath,created_by:state.session.user.id});if(error){if(proofPath)await SB.storage.from(PROOF_BUCKET).remove([proofPath]);throw error}closeModal();toast(t('paymentSaved'));await loadAll(false);renderRound(r.id,'pay')}catch(e){handleError(e);disableModal(false)}}}
async function uploadProofFile(roundId,paymentId,file){if(!file.type.startsWith('image/'))throw new Error('Proof must be an image');const blob=await compressImage(file);const path=`${roundId}/${paymentId}-${Date.now()}.jpg`;const {error}=await SB.storage.from(PROOF_BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;return path}
async function compressImage(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onerror=reject;rd.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error('Image conversion failed')),'image/jpeg',.78)};img.src=rd.result};rd.readAsDataURL(file)})}
async function uploadProofForExisting(r,pid,file){if(!requirePay())return;if(!file)return;try{const p=r.payments.find(x=>x.id===pid);const old=p.proofPath;const path=await uploadProofFile(r.id,pid,file);const {error}=await SB.from('ration_payments').update({proof_path:path}).eq('id',pid);if(error){await SB.storage.from(PROOF_BUCKET).remove([path]);throw error}if(old)await SB.storage.from(PROOF_BUCKET).remove([old]);toast(t('proofUploaded'));await loadAll(false);renderRound(r.id,'pay')}catch(e){handleError(e)}}
async function viewProof(path){try{const {data,error}=await SB.storage.from(PROOF_BUCKET).createSignedUrl(path,300);if(error)throw error;openModal(`<h2>${t('photoProof')}</h2><img class="proof-view" src="${esc(data.signedUrl)}" alt="Payment proof"><div class="actions" style="margin-top:14px"><button class="btn" id="proofClose">${t('cancel')}</button></div>`);document.getElementById('proofClose').onclick=closeModal}catch(e){handleError(e)}}
async function deletePayment(r,pid){if(!requireAdmin())return;if(!confirm(t('confirmDelete')))return;try{const p=r.payments.find(x=>x.id===pid);const {error}=await SB.from('ration_payments').delete().eq('id',pid);if(error)throw error;if(p?.proofPath)await SB.storage.from(PROOF_BUCKET).remove([p.proofPath]);await loadAll(false);renderRound(r.id,'pay')}catch(e){handleError(e)}}

async function shareText(text){if(navigator.share){try{await navigator.share({title:'BL3 Ration Control',text});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);toast('Summary copied')}catch(e){openModal(`<h2>${t('share')}</h2><textarea style="width:100%;min-height:220px">${esc(text)}</textarea><button class="btn" id="shareClose" style="margin-top:10px">${t('cancel')}</button>`);document.getElementById('shareClose').onclick=closeModal}}
function shareRound(r){const x=roundTotals(r);shareText(`${state.settings.site} — ${t('reportText')}\n${t('roundLabel')} ${chronologicalRoundNumber(r)}: ${fmtDate(r.coverageStart)} → ${fmtDate(r.coverageEnd)}\n${t('status')}: ${statusLabel(x.status)}\n${x.people} ${t('people')}\n${t('approved')}: ${money(x.approved)} / ${fc(x.approved*r.fx)}\n${t('paid')}: ${money(x.paid)}\n${t('remaining')}: ${money(x.remaining)}\n${t('proof')}: ${x.proofs}/${r.payments.length}`)}

function renderReports(){const root=document.getElementById('reportsView');root.innerHTML=`<div class="topbar"><div><h1>${t('reports')}</h1><div class="meta">${state.settings.site}</div></div><div class="actions"><button class="btn" id="reportsHome">← ${t('home')}</button><button class="btn" id="reportsPrint">🖨 ${t('print')}</button></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>${t('roundLabel')}</th><th>${t('period')}</th><th>${t('status')}</th><th>${t('people')}</th><th>${t('approved')}</th><th>${t('paid')}</th><th>${t('remaining')}</th><th>${t('proof')}</th></tr></thead><tbody>${state.rounds.map(r=>{const x=roundTotals(r);return `<tr><td>${chronologicalRoundNumber(r)}</td><td>${fmtDate(r.coverageStart)} → ${fmtDate(r.coverageEnd)}</td><td><span class="status ${statusClass(x.status)}"><span class="dot"></span>${statusLabel(x.status)}</span></td><td>${x.people}</td><td>${money(x.approved)}</td><td>${money(x.paid)}</td><td>${money(x.remaining)}</td><td>${x.proofs}/${r.payments.length}</td></tr>`}).join('')}</tbody></table></div></div>`;document.getElementById('reportsHome').onclick=()=>showView('homeView');document.getElementById('reportsPrint').onclick=()=>window.print()}
function renderSettings(){const root=document.getElementById('settingsView');const editable=canAdmin();root.innerHTML=`<div class="topbar"><div><h1>${t('settings')}</h1><div class="meta">${roleLabel()}</div></div><div class="actions"><select id="settingsLang" class="btn"><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option><option value="ln">Lingala</option></select><button class="btn" id="settingsHome">← ${t('home')}</button></div></div><div class="panel"><div class="grid2"><div class="field"><label>${t('siteName')}</label><input id="siteName" value="${esc(state.settings.site)}" ${editable?'':'disabled'}></div><div class="field"><label>${t('defaultFx')}</label><input id="defaultFx" type="number" min="1" step="0.01" value="${state.settings.fx}" ${editable?'':'disabled'}></div><div class="field"><label>${t('cycleDays')}</label><input id="cycleDays" type="number" min="1" max="60" value="${state.settings.cycleDays}" ${editable?'':'disabled'}></div></div>${editable?`<button class="btn primary" id="saveSettings" style="margin-top:14px">${t('saveSettings')}</button>`:''}</div>`;document.getElementById('settingsLang').value=langCode;document.getElementById('settingsLang').onchange=e=>{langCode=e.target.value;localStorage.setItem('bl3_lang',langCode);renderSettings()};document.getElementById('settingsHome').onclick=()=>showView('homeView');const ss=document.getElementById('saveSettings');if(ss)ss.onclick=async()=>{try{const site=document.getElementById('siteName').value.trim()||'BL3',fx=Number(document.getElementById('defaultFx').value)||2200,days=Math.max(1,Math.min(60,Number(document.getElementById('cycleDays').value)||14));const {error}=await SB.from('ration_settings').update({site_name:site,default_fx:fx,cycle_days:days}).eq('id',1);if(error)throw error;toast(t('settingsSaved'));await loadAll(false);renderSettings()}catch(e){handleError(e)}}}

function renderAuth(message='',isErr=false){document.getElementById('appRoot').classList.add('hidden');const root=document.getElementById('authRoot');root.classList.remove('hidden');const c=accessCopy();root.innerHTML=`<div class="auth-card"><div class="access-kicker">${c.kicker}</div><h1>${c.title}</h1><div class="muted">${c.intro}</div>${message?`<div class="auth-msg ${isErr?'auth-error':''}">${esc(message)}</div>`:''}<div class="lang-grid"><button type="button" class="lang-btn ${langCode==='fr'?'active':''}" data-lang="fr">Français</button><button type="button" class="lang-btn ${langCode==='en'?'active':''}" data-lang="en">English</button><button type="button" class="lang-btn ${langCode==='zh'?'active':''}" data-lang="zh">中文</button><button type="button" class="lang-btn ${langCode==='ln'?'active':''}" data-lang="ln">Lingala</button></div><form id="authForm"><div class="field"><input id="accessCode" class="access-code" type="password" autocomplete="off" placeholder="${c.code}" required></div><button class="btn primary" type="submit">${c.open}</button></form><div class="footer-note">BL3 food ration / food-money disbursement control · 14-day rounds · payment photo proof</div></div>`;root.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{langCode=b.dataset.lang;localStorage.setItem('bl3_lang',langCode);renderAuth(message,isErr)});document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter||document.querySelector('#authForm button'),code=document.getElementById('accessCode').value.trim().toUpperCase();try{btn.disabled=true;const res=await fetch(ACCESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessCode:code})});const out=await res.json().catch(()=>({}));if(!res.ok||!out.role)throw new Error(out.error||c.bad);state.role=out.role;localStorage.setItem('bl3_ration_role',out.role);localStorage.setItem('bl3_ration_access_code',code);await enterApp()}catch(err){renderAuth(err.message||c.bad,true)}}}
function applyRoleUI(){const nr=document.getElementById('newRoundSide');if(nr)nr.classList.toggle('hidden',!canAdmin());const settingsBtn=[...document.querySelectorAll('[data-view="settings"]')][0];if(settingsBtn)settingsBtn.classList.toggle('hidden',!canAdmin());document.getElementById('userEmail').textContent=roleLabel()}
async function enterApp(){state.session=true;state.role=state.role||localStorage.getItem('bl3_ration_role');document.getElementById('authRoot').classList.add('hidden');document.getElementById('appRoot').classList.remove('hidden');applyRoleUI();activeView='home';await loadAll(true);setupRealtime()}
async function signOut(){state.session=null;state.role=null;localStorage.removeItem('bl3_ration_role');localStorage.removeItem('bl3_ration_access_code');renderAuth()}
let realtimeChannel=null;function setupRealtime(){if(realtimeChannel)SB.removeChannel(realtimeChannel);realtimeChannel=SB.channel('ration-sync').on('postgres_changes',{event:'*',schema:'public',table:'ration_rounds'},scheduleRefresh).on('postgres_changes',{event:'*',schema:'public',table:'ration_allocations'},scheduleRefresh).on('postgres_changes',{event:'*',schema:'public',table:'ration_payments'},scheduleRefresh).subscribe()}
function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>loadAll(false),350)}

window.addEventListener('online',()=>{setConnectivity();if(state.role)loadAll(false)});window.addEventListener('offline',setConnectivity);
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)showView(b.dataset.view+'View')});
document.getElementById('newRoundSide').onclick=()=>roundModal();document.getElementById('signOutSide').onclick=signOut;document.getElementById('mobileHome').onclick=()=>showView('homeView');
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(console.warn);
(async()=>{setConnectivity();const savedCode=localStorage.getItem('bl3_ration_access_code');if(savedCode){try{const res=await fetch(ACCESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessCode:savedCode})});const out=await res.json();if(res.ok&&out.role){state.role=out.role;localStorage.setItem('bl3_ration_role',out.role);await enterApp();return}}catch(e){}}localStorage.removeItem('bl3_ration_role');localStorage.removeItem('bl3_ration_access_code');renderAuth()})();
</script>
</body>
</html>
